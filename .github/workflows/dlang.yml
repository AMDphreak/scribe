# D language CI: build and test Syndrome on push/PR
name: Dlang CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build (LDC)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler (LDC)
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc

      - name: Build
        run: dub build
