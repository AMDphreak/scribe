name: Scribe Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Scribe Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Dlang Compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Install Dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libx11-dev libxext-dev
          fi
        shell: bash

      - name: Build Scribe (LDC Release)
        run: dub build -c release --compiler=ldmd2
        
      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path bin/scribe.exe, profiles -DestinationPath scribe-windows.zip
        shell: pwsh

      - name: Package Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf scribe-${{ runner.os }}.tar.gz bin/scribe profiles
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            scribe-windows.zip
            scribe-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
