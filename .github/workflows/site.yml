# Build and deploy Scribe site (SolidJS + Antora docs) to GitHub Pages
name: Site

on:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/site.yml"
      - "antora-playbook.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install and build site
        run: |
          cd site
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build Antora docs
        id: antora
        uses: antora-supplemental/antora-build-action@main  # pin to @v1 after you publish a release
        with:
          playbook: antora-playbook.yml
          working_directory: .
          output_dir: site/dist
          node_version: "22"
          skip_install: true
          create_nojekyll: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.antora.outputs.site-path }}

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
