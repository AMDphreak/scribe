<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      /* If this URL is served without a trailing slash, relative `docs/` would resolve to `/docs/`. */
      (function () {
        if (location.pathname === "/scribe") {
          location.replace("/scribe/" + location.search + location.hash);
        }
      })();
    </script>
    <script>
      (function () {
        try {
          var key = "scribe-color-mode";
          var pref = localStorage.getItem(key);
          var mql = window.matchMedia("(prefers-color-scheme: dark)");
          var resolved =
            pref === "light" || pref === "dark" ? pref : mql.matches ? "dark" : "light";
          document.documentElement.dataset.scribeTheme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scribe — Edit static site content from GitHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Pinyon+Script&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
