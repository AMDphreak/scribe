site:
  title: Scribe
  # Published under /scribe/docs/ (GitHub Pages project site + Vite marketing at /scribe/)
  url: https://amdphreak.github.io/scribe/docs
  start_page: docs::index.adoc

content:
  sources:
    - url: ./
      branches: HEAD
      start_path: docs

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./node_modules/antora-dark-theme/supplemental-ui

output:
  # Write only into dist/docs so `pnpm --filter scribe-site build` keeps dist/index.html (marketing).
  dir: site/dist/docs
